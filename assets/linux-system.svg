<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-labelledby="t d"><title id="t">Identify a Linux system and processor</title><desc id="d">Use cat /etc/os-release to identify the distribution and uname -m to identify the processor. x86_64 selects the Intel/AMD package; aarch64 or arm64 selects the ARM64 package.</desc><rect width="1040" height="390" rx="18" fill="#f2f7fb"/><g font-family="Arial,sans-serif" fill="#172b3a"><text x="35" y="44" font-size="24" font-weight="bold">Identify the distribution and processor in Terminal</text><rect x="35" y="75" width="540" height="245" rx="12" fill="#172b3a"/><g font-family="monospace" font-size="20" fill="white"><text x="60" y="117">$ cat /etc/os-release</text><text x="60" y="153" fill="#b5dbf2">ID=ubuntu</text><text x="60" y="185" fill="#b5dbf2">VERSION_ID="24.04"</text><text x="60" y="239">$ uname -m</text><text x="60" y="277" fill="#b5dbf2">x86_64</text></g><text x="610" y="123" font-size="21" font-weight="bold">Processor output</text><text x="610" y="172" font-size="20">x86_64 → Intel / AMD (64-bit)</text><text x="610" y="215" font-size="20">aarch64 → ARM64</text><text x="610" y="258" font-size="20">arm64 → ARM64</text><text x="35" y="359" font-size="17" fill="#526574">Illustrative output. Your distribution and version may differ; use the values reported by your computer.</text></g></svg>
