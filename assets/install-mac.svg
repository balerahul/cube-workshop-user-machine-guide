<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">Install Docker on a Mac</title><desc id="d">Open Docker.dmg, drag Docker to Applications, then open Docker from Applications.</desc><rect width="1000" height="330" rx="18" fill="#f2f7fb"/><g font-family="Arial,sans-serif" fill="#172b3a"><text x="38" y="48" font-size="24" font-weight="bold">Double-click Docker.dmg in Downloads</text><rect x="80" y="90" width="270" height="133" rx="18" fill="#155e9b"/><text x="215" y="166" text-anchor="middle" font-size="31" font-weight="bold" fill="white">Docker</text><path d="M400 155H568M549 139l20 16-20 16" fill="none" stroke="#155e9b" stroke-width="4"/><text x="479" y="197" text-anchor="middle" font-size="20">Drag across</text><path d="M625 105h105l22 22h168v105H625z" fill="#9dd2f3" stroke="#155e9b" stroke-width="2"/><text x="773" y="180" text-anchor="middle" font-size="26" font-weight="bold">Applications</text><text x="38" y="281" font-size="21">Then open Finder → Applications → Docker.</text><text x="38" y="312" font-size="16" fill="#526574">Illustration of the drag-and-drop action. The installer’s appearance may differ.</text></g></svg>
