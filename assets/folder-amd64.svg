<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="480" viewBox="0 0 1080 480" role="img" aria-label="Files inside the extracted cube-laptop folder"><rect width="1080" height="480" rx="18" fill="#f2f7fb"/><text x="35" y="42" font-size="24" font-family="Arial,sans-serif" fill="#172b3a" font-weight="bold">Expected contents of the extracted folder</text><text x="35" y="90" font-size="20" font-family="monospace" fill="#172b3a">cube-laptop/</text><text x="610" y="90" font-size="18" font-family="Arial,sans-serif" fill="#526574">Tutorial working directory</text><text x="35" y="135" font-size="20" font-family="monospace" fill="#172b3a">    START-HERE.html</text><text x="610" y="135" font-size="18" font-family="Arial,sans-serif" fill="#526574">Open the offline guide</text><text x="35" y="180" font-size="20" font-family="monospace" fill="#172b3a">    run.sh</text><text x="610" y="180" font-size="18" font-family="Arial,sans-serif" fill="#526574">Launcher for Mac / Linux</text><text x="35" y="225" font-size="20" font-family="monospace" fill="#172b3a">    run.ps1</text><text x="610" y="225" font-size="18" font-family="Arial,sans-serif" fill="#526574">Launcher for Windows</text><text x="35" y="270" font-size="20" font-family="monospace" fill="#172b3a">    cases/</text><text x="610" y="270" font-size="18" font-family="Arial,sans-serif" fill="#526574">Editable inputs and cylinder mesh</text><text x="35" y="315" font-size="20" font-family="monospace" fill="#172b3a">    reference/</text><text x="610" y="315" font-size="18" font-family="Arial,sans-serif" fill="#526574">Parameter manuals</text><text x="35" y="360" font-size="20" font-family="monospace" fill="#172b3a">    cube-workshop-2026-amd64.tar</text><text x="610" y="360" font-size="18" font-family="Arial,sans-serif" fill="#526574">CUBE image archive — retain this file</text><text x="35" y="405" font-size="20" font-family="monospace" fill="#172b3a">    cube-workshop-2026-amd64.tar.sha256</text><text x="610" y="405" font-size="18" font-family="Arial,sans-serif" fill="#526574">Download check — keep this beside the .tar</text><text x="35" y="451" font-size="17" font-family="Arial,sans-serif" fill="#526574">Illustration. A runs/ folder will appear after your first simulation. Other README and check files are normal.</text></svg>