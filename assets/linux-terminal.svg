<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="355" viewBox="0 0 1040 355" role="img" aria-labelledby="t d"><title id="t">Open a Linux terminal in the tutorial folder</title><desc id="d">Extract the ZIP, open cube-laptop in the file manager, select Open in Terminal, and use ls to confirm that run.sh and cases are present.</desc><rect width="1040" height="355" rx="18" fill="#f2f7fb"/><g font-family="Arial,sans-serif" fill="#172b3a"><text x="35" y="44" font-size="24" font-weight="bold">Open the extracted folder, then open Terminal</text><path d="M55 105h104l25 23h240v130H55z" fill="#9dd2f3" stroke="#155e9b" stroke-width="2"/><text x="238" y="193" text-anchor="middle" font-size="28" font-weight="bold">cube-laptop</text><text x="64" y="293" font-size="19">Right-click the folder background:</text><text x="64" y="321" font-size="19" font-weight="bold">Open in Terminal</text><path d="M449 179h75m-13-12 13 12-13 12" stroke="#155e9b" stroke-width="3" fill="none"/><rect x="555" y="82" width="450" height="178" rx="12" fill="#172b3a"/><g font-family="monospace" font-size="20" fill="white"><text x="578" y="124">…/cube-laptop$ ls</text><text x="578" y="165" fill="#b5dbf2">cases  reference  run.sh</text><text x="578" y="201" fill="#b5dbf2">run.ps1  …</text></g><text x="555" y="293" font-size="17" fill="#526574">Illustration, not a Linux desktop screenshot.</text><text x="555" y="321" font-size="17" fill="#526574">Menu labels depend on your file manager.</text></g></svg>
