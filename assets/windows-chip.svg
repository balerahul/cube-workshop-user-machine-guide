<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" role="img" aria-labelledby="t d"><title id="t">Find the Windows processor type</title><desc id="d">Open Start, Settings, System, About. Under Device specifications, look for System type: 64-bit operating system, x64-based processor.</desc><rect width="1000" height="345" rx="18" fill="#f2f7fb"/><g font-family="Arial,sans-serif" fill="#172b3a"><text x="38" y="47" font-size="23" font-weight="bold">Start → Settings → System → About</text><rect x="38" y="77" width="924" height="190" rx="12" fill="white" stroke="#b4c7d4"/><text x="66" y="119" font-size="23" font-weight="bold">Device specifications</text><text x="66" y="166" font-size="21">Processor</text><text x="285" y="166" font-size="21">Intel … or AMD …</text><rect x="55" y="188" width="887" height="54" rx="8" fill="#e9f3fa" stroke="#155e9b" stroke-width="2"/><text x="66" y="223" font-size="21">System type</text><text x="285" y="223" font-size="21" font-weight="bold">64-bit operating system, x64-based processor</text><text x="38" y="309" font-size="17" fill="#526574">Illustration of the labels to look for. If it says “ARM-based processor”, ask the organizer before continuing.</text></g></svg>
