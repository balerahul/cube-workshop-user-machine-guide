<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-labelledby="t d"><title id="t">Choose the Mac package by its chip</title><desc id="d">In About This Mac, an Apple M-series chip means Apple Silicon. An Intel processor means Intel/AMD package.</desc><rect width="1000" height="350" rx="18" fill="#f2f7fb"/><g font-family="Arial,sans-serif" fill="#172b3a"><text x="38" y="47" font-size="23" font-weight="bold">Apple menu → About This Mac</text><rect x="38" y="77" width="440" height="206" rx="12" fill="white" stroke="#b4c7d4"/><rect x="522" y="77" width="440" height="206" rx="12" fill="white" stroke="#b4c7d4"/><text x="65" y="119" font-size="21">If you see a chip such as:</text><text x="65" y="163" font-size="25" font-weight="bold">Chip   Apple M1 / M2 / M3 / …</text><text x="65" y="224" font-size="23" fill="#155e9b" font-weight="bold">Choose “Mac: Apple Silicon”</text><text x="548" y="119" font-size="21">If you see a processor such as:</text><text x="548" y="163" font-size="25" font-weight="bold">Processor   Intel Core …</text><text x="548" y="224" font-size="23" fill="#155e9b" font-weight="bold">Choose “Mac: Intel”</text><text x="38" y="323" font-size="17" fill="#526574">Illustration of the labels to look for, not a screenshot. The exact model name will vary.</text></g></svg>
