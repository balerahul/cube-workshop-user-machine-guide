<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
<title id="title">How CUBE runs on your laptop</title><desc id="desc">The computer runs Docker Desktop on Windows/macOS or Docker Engine on Linux. Docker starts a container from the supplied image, which already contains CUBE and its libraries. Inputs and results remain in your normal cube-laptop folder.</desc>
<rect width="1040" height="420" fill="#f2f7fb" rx="20"/><g font-family="Arial, sans-serif" fill="#172b3a">
<rect x="40" y="46" width="960" height="326" rx="18" fill="white" stroke="#8196a6" stroke-width="2"/><text x="66" y="83" font-size="25" font-weight="bold">Windows, macOS or Linux computer</text>
<rect x="70" y="120" width="390" height="208" rx="14" fill="#e9f3fa" stroke="#155e9b" stroke-width="2"/><text x="94" y="158" font-size="23" font-weight="bold">Docker runtime</text><text x="94" y="189" font-size="16">Desktop on Windows/macOS; Engine on Linux</text>
<rect x="95" y="213" width="340" height="90" rx="10" fill="#155e9b"/><text x="117" y="247" fill="white" font-size="21" font-weight="bold">Preinstalled CUBE executable</text><text x="117" y="279" fill="white" font-size="18">Program + MPI + required libraries</text>
<path d="M485 219H554M546 210l10 9-10 9M485 251H554M495 242l-10 9 10 9" stroke="#155e9b" stroke-width="3" fill="none"/>
<rect x="586" y="120" width="350" height="208" rx="14" fill="#f7fafc" stroke="#8196a6" stroke-width="2"/><text x="610" y="158" font-size="23" font-weight="bold">Local cube-laptop folder</text><text x="610" y="201" font-size="19">cases/ — inputs you can edit</text><text x="610" y="243" font-size="19">runs/ — results you can keep</text><text x="610" y="286" font-size="18" fill="#526574">Files remain on the local filesystem.</text>
<text x="42" y="401" font-size="16" fill="#526574">Illustration. An “image” is the saved package. A “container” is a running instance of that package.</text></g></svg>
