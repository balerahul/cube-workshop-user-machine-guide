<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="375" viewBox="0 0 1000 375" role="img" aria-labelledby="t d"><title id="t">Open PowerShell in the extracted folder</title><desc id="d">In File Explorer, open cube-laptop, click its address bar, type powershell and press Enter. The PowerShell prompt should end with cube-laptop.</desc><rect width="1000" height="375" rx="18" fill="#f2f7fb"/><g font-family="Arial,sans-serif" fill="#172b3a"><text x="38" y="45" font-size="23" font-weight="bold">Inside the extracted cube-laptop folder</text><rect x="38" y="76" width="924" height="66" rx="10" fill="white" stroke="#155e9b" stroke-width="2"/><text x="62" y="117" font-size="25" font-family="monospace">powershell</text><text x="402" y="117" font-size="19">Type this in File Explorer’s address bar, then press Enter.</text><path d="M500 160v35m-12-12 12 12 12-12" stroke="#155e9b" stroke-width="3" fill="none"/><rect x="38" y="217" width="924" height="100" rx="10" fill="#152b3b"/><text x="60" y="254" font-size="18" fill="#b9d6e8">Windows PowerShell</text><text x="60" y="290" font-size="22" font-family="monospace" fill="white">PS C:\Users\YourName\Downloads\cube-laptop&gt;</text><text x="38" y="354" font-size="17" fill="#526574">Illustration, not a Windows screenshot. Your actual username and folder location will be different.</text></g></svg>
