<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Open Terminal in the Mac tutorial folder</title><desc id="d">Open Terminal with Spotlight, type cd and a space, drag the cube-laptop folder from Finder into Terminal, then press Return.</desc><rect width="1000" height="380" rx="18" fill="#f2f7fb"/><g font-family="Arial,sans-serif" fill="#172b3a"><text x="38" y="46" font-size="23" font-weight="bold">Press Command + Space, type Terminal, press Return</text><rect x="38" y="82" width="924" height="95" rx="12" fill="#152b3b"/><text x="63" y="120" font-size="18" fill="#b9d6e8">Type cd followed by one space. Do not press Return yet.</text><text x="63" y="157" font-size="26" font-family="monospace" fill="white">% cd </text><path d="M65 219h89l20 20h210v81H65z" fill="#9dd2f3" stroke="#155e9b" stroke-width="2"/><text x="224" y="286" text-anchor="middle" font-size="24" font-weight="bold">cube-laptop</text><path d="M413 272H544M528 259l17 13-17 13" fill="none" stroke="#155e9b" stroke-width="3"/><text x="578" y="259" font-size="21">Drag this folder into Terminal.</text><text x="578" y="298" font-size="21">Then press Return.</text><text x="38" y="356" font-size="17" fill="#526574">Illustration. Dragging the folder inserts its location, including any spaces, for you.</text></g></svg>
